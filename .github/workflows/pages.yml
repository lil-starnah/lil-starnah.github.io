name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A8F47B: ${{ secrets.A8F47B }}
          BBC07F: ${{ secrets.BBC07F }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A8F47B', '')
          meta_b = os.environ.get('BBC07F', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 22c5b251009b932334cae35aea66346b0cce -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 071bd6855282b90a -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
